name: Check LotC accepted apps

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (GitHub may run it a few minutes late)
  workflow_dispatch:          # "Run workflow" button for a manual check

permissions:
  contents: write             # lets the run save seen_apps.json back to the repo

concurrency:
  group: lotc-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check for new accepted applications
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python check.py

      - name: Save seen list
        if: always()
        run: |
          if [ -n "$(git status --porcelain seen_apps.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen_apps.json
            git commit -m "Update seen applications"
            git push
          fi
